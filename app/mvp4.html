<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="RASTRE.IA: camada de inteligência artificial do Recife Monitora sobre a base sintética do cliente. Dados simulados.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>RASTRE.IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEEEF1;--surface:#FFFFFF;--surface-2:#F3F4FB;--line:#DADDED;--ink:#1D2040;--ink-2:#4A4F70;--muted:#7D82A2;
  --accent:#5B7CFA;--accent-ink:#FFFFFF;--accent-soft:#E3E9FE;--navy:#2D2FA6;--lav:#C7D0FA;--dots:#B9B7F0;--mint:#B7E0DB;
  --good:#2C7A4B;--good-soft:#DFF1E5;--warn:#9A6B00;--warn-soft:#FBEFC8;--serious:#B5461A;--serious-soft:#FCE3D6;--crit:#A11D2B;--crit-soft:#F9DADD;
  --bar:#5B7CFA;--bar-track:#E3E6F5;--shadow:0 1px 2px rgba(29,32,64,.05),0 6px 18px rgba(91,124,250,.08);
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#141626;--surface:#1B1E33;--surface-2:#232741;--line:#31365A;--ink:#ECEEFA;--ink-2:#B9BDD8;--muted:#8388AA;
  --accent:#8FA6FF;--accent-ink:#10122A;--accent-soft:#262F5C;--navy:#8FA6FF;--lav:#2C3465;--dots:#3C4478;--mint:#2E4A4C;
  --good:#6CC28E;--good-soft:#173826;--warn:#E5B54A;--warn-soft:#3A2E0E;--serious:#F08A5C;--serious-soft:#42210F;--crit:#F07785;--crit-soft:#44161C;
  --bar:#8FA6FF;--bar-track:#2A2F50;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141626;--surface:#1B1E33;--surface-2:#232741;--line:#31365A;--ink:#ECEEFA;--ink-2:#B9BDD8;--muted:#8388AA;
  --accent:#8FA6FF;--accent-ink:#10122A;--accent-soft:#262F5C;--navy:#8FA6FF;--lav:#2C3465;--dots:#3C4478;--mint:#2E4A4C;
  --good:#6CC28E;--good-soft:#173826;--warn:#E5B54A;--warn-soft:#3A2E0E;--serious:#F08A5C;--serious-soft:#42210F;--crit:#F07785;--crit-soft:#44161C;
  --bar:#8FA6FF;--bar-track:#2A2F50;--shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "Inter","Poppins",system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3,h4{font-family:"Poppins","Inter",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:300;color:var(--accent);line-height:1.1;letter-spacing:-.01em}h2{font-size:16px;font-weight:600;letter-spacing:-.005em}h3{font-size:14px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-family:"Poppins",sans-serif;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}

/* shell */
.proto-banner{background:var(--accent);color:var(--accent-ink);font-size:12.5px;padding:6px 16px;text-align:center}
.band{height:10px;background:var(--accent)}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100% - 10px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
@media (max-width:820px){.side{position:fixed}}
.brand{padding:0 6px}
.wordmark{font-family:"Poppins",sans-serif;font-size:22px;line-height:1;color:var(--accent);letter-spacing:-.01em}
.wordmark b{font-weight:700}.wordmark span{font-weight:300}
.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;font-family:Poppins;font-weight:500}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;font-family:Poppins;font-size:13.5px}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px}
.profile{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.profile label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.profile select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.profile .who{display:flex;gap:10px;align-items:center;margin-top:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lav);border:2px solid var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink-2)}
.who small{display:block;color:var(--muted);font-size:12px}
.main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.topbar .sub{color:var(--ink-2);font-size:11px;margin-bottom:4px;font-family:Poppins;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--ink-2);font-family:Poppins;font-weight:500}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.menu-btn{display:none;margin-bottom:8px}
.side-close{display:none;position:absolute;top:14px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);align-items:center;justify-content:center;font-size:18px;color:var(--ink-2)}

/* cards & tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{padding:16px 18px;min-width:0}
.tile .v{font-family:Poppins;font-size:30px;font-weight:500;line-height:1.1;margin:6px 0 2px;color:var(--navy)}
.tile .d{font-size:12.5px;color:var(--ink-2)}
.delta{font-weight:600}.delta.up{color:var(--good)}.delta.down{color:var(--crit)}.delta.flat{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:16px 18px 10px}
.sec-h .more{color:var(--accent);font-weight:600;font-size:13px}

/* semaforo grid */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:0 16px 16px}
.team{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s}
.team:hover{transform:translateY(-1px);border-color:var(--accent)}
.team .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.team .usf{color:var(--muted);font-size:12px}
.team .sc{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.team .sc b{font-family:Poppins;font-size:20px;font-weight:600}
.zone{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.zone::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.z-exc,.z-qua{background:var(--good-soft);color:var(--good)}
.z-ape{background:var(--warn-soft);color:var(--warn)}
.z-cri{background:var(--serious-soft);color:var(--serious)}
.z-ins{background:var(--crit-soft);color:var(--crit)}
.team .flag{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
.spark{width:100%;height:28px;display:block}

/* alerts */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.alert:first-child{border-top:0}
.alert .stripe{border-radius:3px;height:100%;min-height:44px}
.sev{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.sev-crit{background:var(--crit-soft);color:var(--crit)}.sev-alto{background:var(--serious-soft);color:var(--serious)}.sev-aten{background:var(--warn-soft);color:var(--warn)}
.alert .t{font-weight:600;margin:4px 0 2px}
.alert .w{color:var(--ink-2);font-size:13.5px}
.alert .act{display:flex;gap:6px;flex-direction:column;align-items:stretch}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-weight:500;font-size:13px;white-space:nowrap;font-family:Poppins}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.alert.done{opacity:.55}.alert.done .act,.alert.snoozed .act{opacity:1}.alert.done .t::after{content:" · tratado";color:var(--good)}
.alert.snoozed{opacity:.55}.alert.snoozed .t::after{content:" · adiado 7 dias";color:var(--muted)}

/* detail */
.back{color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media (max-width:980px){.detail{grid-template-columns:1fr}}
.axes{padding:16px;display:flex;flex-direction:column;gap:14px}
.axis .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.axis .lbl b{font-weight:600}
.bar{height:10px;border-radius:4px;background:var(--bar-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.sub-bars{margin:8px 0 0 0;display:grid;grid-template-columns:1fr;gap:5px}
.sub{display:grid;grid-template-columns:1fr 90px 46px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.sub .bar{height:6px}
.sub.low{color:var(--serious)}.sub.low .bar i{background:var(--serious)}
.trend{padding:16px}
.trend svg{width:100%;height:150px;display:block}
.recs{display:flex;flex-direction:column}
.rec{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:12px}
.rec:first-child{border-top:0}
.rec .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12.5px;font-family:Poppins}
.rec .t{font-weight:600}
.rec .w{color:var(--ink-2);font-size:13.5px;margin:2px 0 6px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--navy);background:var(--accent-soft);padding:2px 9px;border-radius:999px;margin-right:6px;margin-bottom:4px}
.src::before{content:"§";font-weight:700}
.gain{font-size:12px;color:var(--muted)}
.ai-note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:center}

/* timeline */
.tl{display:flex;justify-content:space-between;padding:12px 16px 16px;position:relative;font-size:12px;color:var(--ink-2)}
.tl::before{content:"";position:absolute;left:24px;right:24px;top:22px;height:2px;background:var(--line)}
.tl div{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;width:22%}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl .done i{background:var(--accent);border-color:var(--accent)}
.tl .now i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .now{color:var(--accent);font-weight:600}

/* report */
.report{max-width:860px;padding:32px 36px}
.report .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--accent);padding-bottom:14px;margin-bottom:18px}
.report h2{font-size:24px;font-weight:300;color:var(--accent)}
.report h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.report p,.report li{max-width:70ch}
.report ul{margin:0;padding-left:18px}
.report .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.report .kv{grid-template-columns:1fr 1fr}.report{padding:20px}}
.report .kv div{background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.report .kv b{display:block;font-family:Poppins;font-size:20px}
.report .kv span{font-size:12px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--accent-ink);background:var(--accent);font-family:Poppins;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}

/* district bars (central) */
.dist{padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:120px 1fr 56px;gap:12px;align-items:center;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px}
.drow:hover{background:var(--surface-2)}
.drow .bar{height:14px}
.drow .cr{font-size:11.5px;color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;min-width:0;height:min(72vh,720px);min-height:460px}
.msgs{padding:18px;min-width:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.b{background:var(--surface-2)}
.msg.b{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.b .srcs{margin-top:8px;display:flex;flex-wrap:wrap}
.msg.b ul{margin:6px 0 0;padding-left:18px}
.msg.b .scope{font-size:11.5px;color:var(--muted);margin-top:6px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 14px}
.composer{min-width:0;border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);background:var(--surface);text-align:left;white-space:normal}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.composer form{display:flex;gap:8px}
.composer input{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.privacy{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* configurações */
.settings{max-width:720px;display:flex;flex-direction:column;gap:16px}
.setting{padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.setting .t{font-weight:600}.setting .w{color:var(--ink-2);font-size:13.5px;margin-top:2px;max-width:46ch}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--ink-2);font-family:Poppins;display:inline-flex;gap:6px;align-items:center}
.seg button svg{width:15px;height:15px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.switch{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:.15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
@media (max-width:600px){.setting{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast-undo{margin-left:14px;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;z-index:10;width:260px;transform:translateX(-100%);transition:.2s;height:100%}
  h1{font-size:24px}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;align-items:center;gap:8px}
  .main{padding:16px 16px 60px}
  .tiles{grid-template-columns:1fr 1fr;gap:8px}.tile{padding:12px 12px}.tile .v{font-size:24px}
  .topbar .sub{white-space:normal}
  .side-close{display:inline-flex}
  .hist-grid div{font-size:9px;height:22px}
  .trend svg{height:130px}
  .alert{grid-template-columns:6px 1fr}.alert .act{grid-column:2;flex-direction:row}
  .drow{grid-template-columns:90px 1fr 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<style>
/* v2: dados, qualidade e planos */
.sim{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 10px;border-radius:999px;font-family:Poppins}
.sim::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.side .sim{align-self:flex-start;margin:-8px 6px 0}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.info{background:var(--accent-soft);color:var(--navy)}.badge.mute{background:var(--surface-2);color:var(--muted)}
.team.np{opacity:.75;border-style:dashed}
.team .badges{display:flex;gap:4px;flex-wrap:wrap}
.dims{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.dim{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.dim .bar{height:6px}
.mat{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.mat-1{background:var(--serious-soft);color:var(--serious)}.mat-2{background:var(--warn-soft);color:var(--warn)}.mat-3{background:var(--good-soft);color:var(--good)}
.plan{padding:16px 18px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr;gap:8px}
.plan:first-child{border-top:0}
.plan .txt{font-size:13.5px;color:var(--ink-2);line-height:1.5;max-width:80ch}
.plan .hd{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.rewrite{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55;max-width:80ch}
.rewrite b{color:var(--navy)}
.q-row td:first-child{font-weight:600}
.q-n{font-family:Poppins;font-weight:600;color:var(--navy)}
.hist-grid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:10px}

  if(/prazo|calend|cronograma|quando|data/.test(l))return{h:`Ciclo ${CURC} (2º quadrimestre de 2026):<ul><li>Autoavaliação por equipes (Eixo 1): encerrada em 31/08.</li><li>Satisfação do usuário (Eixo 2): coleta contínua por QR code e WhatsApp até 30/09.</li><li>Indicadores de desempenho (Eixo 3): consolidação até 15/10.</li><li>Certificação e divulgação: prevista para 31/10.</li></ul>Datas ilustrativas; a versão final lê o calendário oficial do programa.`,src:["Manual de Avaliação de Qualidade, Ciclos e Fases"]};
  if(/qualidade|base de dados|problema.*dados|duplic|formato|limpeza|sanea/.test(l)){const Q=DATA.qualidade.filter(q=>q.linhas>0).sort((a,b)=>b.linhas-a.linhas).slice(0,6);return{h:`O pipeline registrou ${DATA.qualidade.length} verificações na base de 24/09. As de maior volume:<ul>${Q.map(q=>`<li><b>${q.tabela}</b>: ${q.problema} (${q.linhas} linhas). ${q.decisao}.</li>`).join("")}</ul>Há também 4 divergências entre a base e o Manual (zonas, blocos, Eixo 2 e Eixo 3) levadas ao cliente.`,src:["qualidade_dados.json (pipeline preparar_dados.py)","Página Qualidade dos dados"]}}
  if(/nps|asu|satisfa|detrator|promotor|atributo/.test(l))return{h:`Na base do cliente, o Eixo 2 (200 pontos) é a média do NPS de 5 atributos (acolhimento, tempo de espera, resolutividade, estrutura e limpeza, vínculo) somada a 100. Cada atributo tem o número de respondentes do ciclo. Isso difere do Manual, que prevê 6 perguntas e conversão por faixas (Quadro 7); a divergência está registrada para confirmação com o NIIMA.`,src:["nps_atributos.csv e dicionário de dados","Manual de Avaliação de Qualidade, Eixo 2, Quadro 7"]};
  if(/zona|classifica|certifica|faixa|excel/.test(l)&&!/quais/.test(l))return{h:`Faixas em uso (dicionário da base): Excelência a partir de 850; Qualidade de 700 a 849; Aperfeiçoamento de 550 a 699; Crítica de 400 a 549; Insuficiente abaixo de 400. O Manual de Avaliação usa 900/800/600/400; os parâmetros ficam em tabela configurável e a decisão final é do NIIMA.`,src:["Dicionário de dados, regra 6","Manual de Avaliação de Qualidade, Quadro 10"]};
  if(/plano|smart|maturidade|governan/.test(l)){const pl=[];scoped.forEach(t=>t.planos.forEach(p=>pl.push(p)));const c=[1,2,3].map(n=>pl.filter(p=>p.n===n).length);return{h:`${P.label} tem ${pl.length} planos de ação desde 2023: ${c[0]} em Reformulação, ${c[1]} em Ajustes e ${c[2]} Aprovados. Os planos são avaliados em governança, formulação SMART e viabilidade (1 a 5). O ponto fraco mais comum é a meta sem número e sem prazo. Na página da equipe, o botão "Reescrever com IA" propõe a versão SMART a partir do indicador de maior perda.`,src:["planos_acao.csv (dim_governanca, dim_smart, dim_viabilidade)"]}}
  if(/quais|liste|lista|mostre|abaixo/.test(l)){const crit=scoped.filter(t=>status(t)==="ok"&&pts(t)<550).sort((a,b)=>score(a)-score(b));return{h:crit.length?`${crit.length} equipe${crit.length>1?"s":""} de ${P.label} abaixo de 550 pontos em ${CURC}:<ul>${crit.slice(0,8).map(t=>`<li>${t.nome}: ${score(t)} pts, ${zone(pts(t)).name}, ${t.prof} profissionais</li>`).join("")}</ul>${crit.length>8?`E mais ${crit.length-8}. `:""}Sugiro começar pelas de maior porte.`:`Nenhuma equipe de ${P.label} está abaixo de 550 pontos em ${CURC}.`,src:[`Ciclo ${CURC} (base do cliente)`,"Dicionário de dados, regra 6"]}}
  if(/particip|desclassific|ausente|volunt/.test(l)){const d=scoped.filter(t=>status(t)==="desclassificada"),a=scoped.filter(t=>status(t)==="ausente");return{h:`Em ${CURC}, ${scoped.length-d.length-a.length} de ${scoped.length} equipes de ${P.label} têm pontuação. ${d.length} desclassificada(s)${d.length?": "+d.map(t=>t.nome).join(", "):""}; ${a.length} sem registro${a.length?": "+a.map(t=>t.nome).join(", "):""}. A participação é voluntária: ausência é tratada como falta de dado, não como queda.`,src:["resultados_ciclos (situacao_participacao)","LEIA-ME do cliente: adesão voluntária"]}}
  if(/dado|lgpd|privac|externa|seguran/.test(l))return{h:`Este assistente responde apenas com a base interna (resultados, manuais, planos e log de qualidade), respeita o seu perfil de acesso e não envia dados para serviços externos. Em produção a inferência roda em servidor da Secretaria; toda consulta fica em trilha de auditoria.`,src:["Documento de Requisitos, RF09, RNF01, RNF05"]};
  return{h:`Posso ajudar com resultados das equipes do seu recorte (${P.label}), critérios dos 3 eixos, planos de ação, participação, prazos e qualidade da base. Cite uma equipe pelo número (ex.: Equipe 080) ou use uma pergunta sugerida.`,src:["Base interna do Recife Monitora"]}}
function vChat(){const P=PROFILES[profile];return header("Assistente RASTRE.IA",`Responde com a base interna do programa · recorte: ${P.label}`,`<span class="chip">Sem acesso a IAs externas</span>`)+
  `<section class="card chat"><div class="msgs" id="msgs">${chatLog.length?"":`<div class="msg b">Olá, ${P.n.split(" ")[0]}. Posso responder sobre resultados, planos de ação, manuais, prazos e a qualidade da base, sempre citando a fonte. O que você quer saber?</div>`}${chatLog.map(m=>m.u?`<div class="msg u">${m.u}</div>`:`<div class="msg b">${m.h}<div class="srcs">${m.src.map(s=>`<span class="src">${s}</span>`).join("")}</div>${m.team?`<div style="margin-top:8px"><button class="btn sm" data-open="${m.team.id}">Abrir página da equipe</button></div>`:""}<div class="scope">Perfil ${profile} · ciclo ${CURC} · dados simulados</div></div>`).join("")}</div>
  <div class="composer"><div class="quick">${QUICK.map(q=>`<button data-q="${q}">${q}</button>`).join("")}</div><form id="chatf"><input id="chati" autocomplete="off" placeholder="Pergunte sobre equipes, planos, prazos, critérios ou manuais" aria-label="Pergunta"><button class="btn pri" type="submit">Enviar</button></form><div class="privacy">🔒 Consultas restritas à base interna, registradas em trilha de auditoria (LGPD).</div></div></section>`}
function ask(q){chatLog.push({u:q});view="chat";render();const m=$("#msgs");const ty=document.createElement("div");ty.className="typing";ty.textContent="Consultando a base interna…";m.appendChild(ty);m.scrollTop=m.scrollHeight;setTimeout(()=>{chatLog.push(answer(q));render();const mm=$("#msgs");mm.scrollTop=mm.scrollHeight},700)}
function vConfig(){const P=PROFILES[profile];const I={auto:"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18V4a8 8 0 0 1 0 16z",light:"M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5h0l1 3h-2l1-3zm0 20l-1-3h2l-1 3zM2 12l3-1v2l-3-1zm20 0l-3 1v-2l3 1zM4.9 4.9l2.8 1.4-1.4 1.4L4.9 4.9zm14.2 14.2l-2.8-1.4 1.4-1.4 1.4 2.8zM4.9 19.1l1.4-2.8 1.4 1.4-2.8 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4 2.8-1.4z",dark:"M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"};
  const opt=(k,l)=>`<button class="${theme===k?"on":""}" data-theme="${k}" aria-pressed="${theme===k}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="${I[k]}"/></svg>${l}</button>`;
  const sw=(k,t,w)=>`<div class="card setting"><div><div class="t">${t}</div><div class="w">${w}</div></div><button class="switch ${prefs[k]?"on":""}" data-pref="${k}" role="switch" aria-checked="${prefs[k]}" aria-label="${t}"></button></div>`;
  return header("Configurações",`${P.n} · perfil ${profile}`)+`<div class="settings">
  <div class="card setting"><div><div class="t">Aparência</div><div class="w">Tema claro, escuro ou seguir a preferência do sistema. A escolha fica salva neste navegador.</div></div><div class="seg" role="group" aria-label="Tema">${opt("auto","Automático")}${opt("light","Claro")}${opt("dark","Escuro")}</div></div>
  <h2 style="margin-top:8px">Parâmetros do programa (somente leitura)</h2>
  <div class="card setting"><div><div class="t">Zonas de classificação</div><div class="w">Excelência ≥ 850 · Qualidade ≥ 700 · Aperfeiçoamento ≥ 550 · Crítica ≥ 400. Fonte: dicionário da base. O Manual prevê 900/800/600/400; definição pendente do NIIMA.</div></div><span class="badge warn">divergência</span></div>
  <div class="card setting"><div><div class="t">Máximos do Eixo 1</div><div class="w">Bloco A 80 · Bloco B 60 · Bloco C 60 (base). Manual: 40 / 80 / 80.</div></div><span class="badge warn">divergência</span></div>
  <h2 style="margin-top:8px">Notificações</h2>
  ${sw("email","Alertas por e-mail institucional","Resumo diário dos alertas críticos e altos do seu recorte.")}
  ${sw("whatsapp","Alertas por WhatsApp","Grupo institucional do distrito. Depende de aprovação da SEAB.")}
  ${sw("digest","Resumo do quadrimestre automático","Receber o PDF assim que o ciclo for certificado.")}
  <div class="ai-note" style="border:0;padding:4px 2px">Perfis, acessos e regras de criticidade são definidos pelo NIIMA e não podem ser alterados aqui.</div></div>`}
/* ---------- render ---------- */
function renderUser(){const P=PROFILES[profile];$("#usel-img").src=AVATARS[profile];$("#usel-n").textContent=P.n;$("#usel-r").textContent=P.r;$("#acl-note").textContent=USERS.find(u=>u[0]===profile)[1]+". Cada usuário acessa apenas o seu recorte.";
  $("#usel-menu").innerHTML=USERS.map(([k,l])=>`<button role="option" data-p="${k}" class="${k===profile?"on":""}" aria-selected="${k===profile}"><img src="${AVATARS[k]}" alt=""><span><b>${PROFILES[k].n}</b><small>${PROFILES[k].r}</small><span class="lvl"><svg viewBox="0 0 24 24"><path d="${LEVEL_ICON[k]}"/></svg>${l.split(" · ")[0]}</span></span></button>`).join("");
  $("#usel-menu").querySelectorAll("button").forEach(b=>b.onclick=()=>{closeMenu();if(b.dataset.p===profile)return;profile=b.dataset.p;view="painel";selTeam=null;filterZone="todas";distFilter=null;chatLog.length=0;$("#side").classList.remove("open");render();window.scrollTo(0,0)})}
function closeMenu(){$("#usel-menu").hidden=true;$("#usel-btn").setAttribute("aria-expanded","false")}
function render(){renderUser();renderNav();
  const m=$("#main");m.innerHTML=view==="painel"?vPainel():view==="alertas"?vAlertas():view==="equipe"?vEquipe():view==="planos"?vPlanos():view==="resumo"?vResumo():view==="qualidade"?vQualidade():view==="config"?vConfig():vChat();
  m.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{selTeam=+el.dataset.id;view="equipe";render();window.scrollTo(0,0)});
  m.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{e.stopPropagation();selTeam=+el.dataset.open;view="equipe";render();window.scrollTo(0,0)});
  m.querySelectorAll("[data-done]").forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.done;alertState[id]="done";render();toast("Alerta marcado como tratado.",()=>{delete alertState[id];render()})});
  m.querySelectorAll("[data-snooze]").forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.snooze;alertState[id]="snoozed";render();toast("Alerta adiado por 7 dias.",()=>{delete alertState[id];render()})});
  m.querySelectorAll("[data-undo]").forEach(el=>el.onclick=e=>{e.stopPropagation();delete alertState[el.dataset.undo];toast("Alerta reaberto.");render()});
  m.querySelectorAll("[data-z]").forEach(el=>el.onclick=()=>{filterZone=el.dataset.z;render()});
  m.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{distFilter=el.dataset.d||null;render()});
  m.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{view=el.dataset.go;render()});
  m.querySelectorAll("[data-toast]").forEach(el=>el.onclick=()=>toast(el.dataset.toast));
  m.querySelectorAll("[data-ask]").forEach(el=>el.onclick=()=>ask(el.dataset.ask));
  m.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>ask(el.dataset.q));
  m.querySelectorAll("[data-rew]").forEach(el=>el.onclick=()=>{const[tid,pid]=el.dataset.rew.split(":");const t=teams.find(x=>x.id===+tid),p=t.planos.find(x=>x.id===pid);const box=document.getElementById("rew-"+pid);box.innerHTML=`<div class="eyebrow" style="margin-bottom:6px">Proposta da IA · formato SMART · revisar antes de registrar</div>${planRewrite(t,p)}<div style="margin-top:10px;display:flex;gap:8px"><button class="btn sm pri" data-toast="Plano reescrito enviado à equipe para validação (simulado).">Enviar à equipe</button><button class="btn sm" data-toast="Proposta descartada.">Descartar</button></div>`;box.hidden=false;box.querySelectorAll("[data-toast]").forEach(b=>b.onclick=()=>toast(b.dataset.toast));el.hidden=true});
  m.querySelectorAll("[data-theme]").forEach(el=>el.onclick=()=>{theme=el.dataset.theme;applyTheme();render();toast(theme==="auto"?"Tema segue o sistema.":theme==="light"?"Tema claro ativado.":"Tema escuro ativado.")});
  m.querySelectorAll("[data-pref]").forEach(el=>el.onclick=()=>{prefs[el.dataset.pref]=!prefs[el.dataset.pref];render()});
  const back=$("#back");if(back)back.onclick=()=>{view="painel";render()};
  const menu=$("#menu");if(menu)menu.onclick=e=>{e.stopPropagation();$("#side").classList.add("open")};
  const f=$("#chatf");if(f){f.onsubmit=e=>{e.preventDefault();const v=$("#chati").value.trim();if(v){$("#chati").value="";ask(v)}};const mm=$("#msgs");mm.scrollTop=mm.scrollHeight}}
$("#usel-btn").onclick=e=>{e.stopPropagation();const m=$("#usel-menu");m.hidden=!m.hidden;$("#usel-btn").setAttribute("aria-expanded",String(!m.hidden))};
document.addEventListener("click",e=>{if(!e.target.closest("#profile"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();$("#side").classList.remove("open")}});
$("#side-close").onclick=()=>$("#side").classList.remove("open");
document.addEventListener("click",e=>{if(window.innerWidth<=820&&!e.target.closest("#side")&&!e.target.closest("#menu"))$("#side").classList.remove("open")});
render();
</script>
</body></html>
