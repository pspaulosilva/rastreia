<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Protótipo da camada de inteligência artificial do Recife Monitora: alertas de priorização, recomendações com fonte, resumo do quadrimestre e assistente interno. Dados sintéticos.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Recife Monitora IA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F3F6F7;--surface:#FFFFFF;--surface-2:#E9EFF1;--line:#D5DEE2;--ink:#14232A;--ink-2:#46595F;--muted:#7A8B91;
  --accent:#0E6B72;--accent-ink:#FFFFFF;--accent-soft:#D9EEF0;
  --good:#2C7A4B;--good-soft:#DFF1E5;--warn:#9A6B00;--warn-soft:#FBEFC8;--serious:#B5461A;--serious-soft:#FCE3D6;--crit:#A11D2B;--crit-soft:#F9DADD;
  --bar:#3A8F96;--bar-track:#E1EAEC;--shadow:0 1px 2px rgba(20,35,42,.06),0 4px 14px rgba(20,35,42,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0F181B;--surface:#162327;--surface-2:#1E2E33;--line:#2B3D43;--ink:#E8EEF0;--ink-2:#B4C2C7;--muted:#7F929A;
  --accent:#5FC0C6;--accent-ink:#0B1A1C;--accent-soft:#173B3E;
  --good:#6CC28E;--good-soft:#173826;--warn:#E5B54A;--warn-soft:#3A2E0E;--serious:#F08A5C;--serious-soft:#42210F;--crit:#F07785;--crit-soft:#44161C;
  --bar:#5FC0C6;--bar-track:#233539;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F181B;--surface:#162327;--surface-2:#1E2E33;--line:#2B3D43;--ink:#E8EEF0;--ink-2:#B4C2C7;--muted:#7F929A;
  --accent:#5FC0C6;--accent-ink:#0B1A1C;--accent-soft:#173B3E;
  --good:#6CC28E;--good-soft:#173826;--warn:#E5B54A;--warn-soft:#3A2E0E;--serious:#F08A5C;--serious-soft:#42210F;--crit:#F07785;--crit-soft:#44161C;
  --bar:#5FC0C6;--bar-track:#233539;--shadow:none}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,Segoe UI,sans-serif}
h1,h2,h3,h4{font-family:"Sora","Public Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:20px;font-weight:600}h2{font-size:17px;font-weight:600}h3{font-size:14px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* shell */
.proto-banner{background:var(--accent);color:var(--accent-ink);font-size:12.5px;padding:6px 16px;text-align:center}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:Sora;font-weight:700;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px}
.profile{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
.profile label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.profile select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.profile .who{display:flex;gap:10px;align-items:center;margin-top:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--ink-2)}
.who small{display:block;color:var(--muted);font-size:12px}
.main{padding:22px 28px 60px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.topbar .sub{color:var(--ink-2);font-size:13.5px;margin-top:2px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:999px;font-size:13px;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu-btn{display:none}

/* cards & tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{padding:14px 16px}
.tile .v{font-family:Sora;font-size:26px;font-weight:600;line-height:1.1;margin:4px 0 2px}
.tile .d{font-size:12.5px;color:var(--ink-2)}
.delta{font-weight:600}.delta.up{color:var(--good)}.delta.down{color:var(--crit)}.delta.flat{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.sec-h .more{color:var(--accent);font-weight:600;font-size:13px}

/* semaforo grid */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:0 16px 16px}
.team{border:1px solid var(--line);border-radius:9px;padding:12px 12px 10px;text-align:left;background:var(--surface);display:flex;flex-direction:column;gap:6px;position:relative;transition:transform .12s}
.team:hover{transform:translateY(-1px);border-color:var(--accent)}
.team .nm{font-weight:600;font-size:13.5px;line-height:1.25}
.team .usf{color:var(--muted);font-size:12px}
.team .sc{display:flex;align-items:baseline;gap:8px;margin-top:2px}
.team .sc b{font-family:Sora;font-size:20px;font-weight:600}
.zone{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.zone::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.z-exc,.z-qua{background:var(--good-soft);color:var(--good)}
.z-ape{background:var(--warn-soft);color:var(--warn)}
.z-cri{background:var(--serious-soft);color:var(--serious)}
.z-ins{background:var(--crit-soft);color:var(--crit)}
.team .flag{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%}
.spark{width:100%;height:28px;display:block}

/* alerts */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:14px;padding:14px 16px;border-top:1px solid var(--line);align-items:start}
.alert:first-child{border-top:0}
.alert .stripe{border-radius:3px;height:100%;min-height:44px}
.sev{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
.sev-crit{background:var(--crit-soft);color:var(--crit)}.sev-alto{background:var(--serious-soft);color:var(--serious)}.sev-aten{background:var(--warn-soft);color:var(--warn)}
.alert .t{font-weight:600;margin:4px 0 2px}
.alert .w{color:var(--ink-2);font-size:13.5px}
.alert .act{display:flex;gap:6px;flex-direction:column;align-items:stretch}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.alert.done{opacity:.55}.alert.done .t::after{content:" · tratado";color:var(--good)}
.alert.snoozed{opacity:.55}.alert.snoozed .t::after{content:" · adiado 7 dias";color:var(--muted)}

/* detail */
.back{color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media (max-width:980px){.detail{grid-template-columns:1fr}}
.axes{padding:16px;display:flex;flex-direction:column;gap:14px}
.axis .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.axis .lbl b{font-weight:600}
.bar{height:10px;border-radius:4px;background:var(--bar-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.sub-bars{margin:8px 0 0 0;display:grid;grid-template-columns:1fr;gap:5px}
.sub{display:grid;grid-template-columns:1fr 90px 46px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.sub .bar{height:6px}
.sub.low{color:var(--serious)}.sub.low .bar i{background:var(--serious)}
.trend{padding:16px}
.trend svg{width:100%;height:150px;display:block}
.recs{display:flex;flex-direction:column}
.rec{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:28px 1fr;gap:12px}
.rec:first-child{border-top:0}
.rec .n{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12.5px;font-family:Sora}
.rec .t{font-weight:600}
.rec .w{color:var(--ink-2);font-size:13.5px;margin:2px 0 6px}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:5px;margin-right:6px;margin-bottom:4px}
.src::before{content:"§";font-weight:700}
.gain{font-size:12px;color:var(--muted)}
.ai-note{font-size:12px;color:var(--muted);padding:10px 16px;border-top:1px dashed var(--line);display:flex;gap:6px;align-items:center}

/* timeline */
.tl{display:flex;justify-content:space-between;padding:12px 16px 16px;position:relative;font-size:12px;color:var(--ink-2)}
.tl::before{content:"";position:absolute;left:24px;right:24px;top:22px;height:2px;background:var(--line)}
.tl div{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center;width:22%}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl .done i{background:var(--accent);border-color:var(--accent)}
.tl .now i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .now{color:var(--accent);font-weight:600}

/* report */
.report{max-width:860px;padding:32px 36px}
.report .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.report h2{font-size:22px}
.report h3{margin:18px 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.report p,.report li{max-width:70ch}
.report ul{margin:0;padding-left:18px}
.report .kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:700px){.report .kv{grid-template-columns:1fr 1fr}.report{padding:20px}}
.report .kv div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.report .kv b{display:block;font-family:Sora;font-size:20px}
.report .kv span{font-size:12px;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl-wrap{overflow-x:auto}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}

/* district bars (central) */
.dist{padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px}
.drow{display:grid;grid-template-columns:120px 1fr 56px;gap:12px;align-items:center;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px}
.drow:hover{background:var(--surface-2)}
.drow .bar{height:14px}
.drow .cr{font-size:11.5px;color:var(--muted)}

/* chat */
.chat{display:grid;grid-template-rows:1fr auto;height:min(72vh,720px);min-height:460px}
.msgs{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.msg{max-width:78%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.msg.b .srcs{margin-top:8px;display:flex;flex-wrap:wrap}
.msg.b ul{margin:6px 0 0;padding-left:18px}
.msg.b .scope{font-size:11.5px;color:var(--muted);margin-top:6px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:4px 14px}
.composer{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.composer form{display:flex;gap:8px}
.composer input{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.privacy{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;box-shadow:var(--shadow);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;z-index:10;width:260px;transform:translateX(-100%);transition:.2s;height:100%}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;align-items:center;gap:8px}
  .main{padding:16px 16px 60px}
  .alert{grid-template-columns:6px 1fr}.alert .act{grid-column:2;flex-direction:row}
  .drow{grid-template-columns:90px 1fr 48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><div class="mark">RM</div><div><strong>Recife Monitora</strong><small>Camada de inteligência</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="profile">
      <label for="profile">Perfil de acesso</label>
      <select id="profile">
        <option value="distrital">Distrital · DS IV</option>
        <option value="local">Local · USF Alto do Mandu</option>
        <option value="central">Central · NIIMA/SEAB</option>
      </select>
      <div class="who"><div class="avatar" id="who-av">AL</div><div><strong id="who-n">Ana Lúcia</strong><small id="who-r">Gestora do Distrito Sanitário IV</small></div></div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------- dados sintéticos ---------- */
const CYCLES=["2025.1","2025.2","2025.3","2026.1","2026.2"];
const CUR=4;
const DISTRICTS=["DS I","DS II","DS III","DS IV","DS V","DS VI","DS VII","DS VIII"];
const ZONES=[["Excelência","z-exc",900],["Qualidade","z-qua",800],["Aperfeiçoamento","z-ape",600],["Crítica","z-cri",400],["Insuficiente","z-ins",0]];
function zone(s){for(const z of ZONES){if(s>=z[2])return{name:z[0],cls:z[1]}}return{name:"Insuficiente",cls:"z-ins"}}
let seed=17;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
function ri(a,b){return Math.round(a+rnd()*(b-a))}
const USF_NAMES={"DS I":["Santo Amaro","Coelhos","Ilha Joana Bezerra","Boa Vista","Coque","São José"],"DS II":["Água Fria","Campina do Barreto","Fundão","Beberibe","Arruda","Cajueiro"],"DS III":["Nova Descoberta","Vasco da Gama","Macaxeira","Córrego do Jenipapo","Alto José do Pinho","Passarinho"],"DS IV":["Alto do Mandu","Casa Amarela","Várzea","Iputinga","Cordeiro","Engenho do Meio","Torrões","Caxangá"],"DS V":["Afogados","Mangueira","Mustardinha","Jardim São Paulo","Estância","Bongi"],"DS VI":["Ibura","Jordão","Cohab","Imbiribeira","Pina","Brasília Teimosa"],"DS VII":["Guabiraba","Pau Ferro","Passarinho II","Brejo da Guabiraba","Macaxeira II","Sítio dos Pintos"],"DS VIII":["Ibura de Baixo","Lagoa Encantada","UR-10","Três Carneiros","Monte Verde","Jordão Baixo"]};
const TYPES=["eSF","eSF","eSB","eMulti"];
const E2_ATTR=[["Acesso",40],["Longitudinalidade",40],["Integralidade",40],["Acolhimento",20],["Coordenação do cuidado",20],["Satisfação geral",40]];
const E3_IND=[["Gestantes com 6 consultas de pré-natal",75],["Gestantes com exames de sífilis e HIV",75],["Gestantes com atendimento odontológico",75],["Citopatológico em dia (25 a 64 anos)",75],["Vacinação infantil (polio e penta)",75],["Hipertensos com PA aferida no semestre",75],["Diabéticos com HbA1c solicitada",75],["Cobertura de primeira consulta odontológica",75]];
const teams=[];let id=1;
for(const d of DISTRICTS){const usfs=USF_NAMES[d];usfs.forEach((u,i)=>{const n=i<2?2:1;for(let k=0;k<n;k++){const type=TYPES[(i+k)%4];
  const base=ri(520,900);const hist=[];let s=base;for(let c=0;c<5;c++){s=Math.max(300,Math.min(980,s+ri(-60,60)));hist.push(s)}
  teams.push({id:id++,name:`${type} ${u}${n>1?" "+["I","II"][k]:""}`,usf:`USF ${u}`,district:d,type,hist,prof:ri(8,80),vuln:rnd()<.35});}})}
/* equipes com história definida no DS IV */
function setTeam(name,hist,vuln){const t=teams.find(x=>x.name===name);if(t){t.hist=hist;t.vuln=vuln}}
setTeam("eSF Alto do Mandu I",[742,761,738,703,548],true);
setTeam("eSF Alto do Mandu II",[812,826,798,771,712],true);
setTeam("eSF Casa Amarela I",[688,701,712,726,745],false);
setTeam("eSB Casa Amarela II",[655,640,598,571,552],true);
setTeam("eSB Várzea",[905,912,908,918,921],false);
setTeam("eMulti Iputinga",[834,841,822,783,705],false);
setTeam("eSF Cordeiro",[771,784,796,811,842],false);
setTeam("eSF Engenho do Meio",[602,618,625,611,589],true);
setTeam("eSB Torrões",[498,515,502,489,462],true);
setTeam("eMulti Caxangá",[858,871,866,874,880],false);
const LOCAL_USF="USF Alto do Mandu";
/* decomposição por eixo derivada da pontuação total */
function breakdown(t){seed=t.id*7+3;const tot=t.hist[CUR],prev=t.hist[CUR-1];
  const e1=Math.round(tot*.2*(0.85+rnd()*.3)),e2=Math.round(tot*.2*(0.8+rnd()*.35));let e3=tot-e1-e2;
  const c1=Math.min(200,Math.max(40,e1)),c2=Math.min(200,Math.max(30,e2));e3=Math.min(600,Math.max(120,tot-c1-c2));
  const blocks=[["Bloco A · Relações de trabalho",40],["Bloco B · Ações e processos",80],["Bloco C · Estrutura da AB",80]].map(([n,m])=>({n,m,v:Math.round(m*(c1/200)*(0.75+rnd()*.5))}));
  const attrs=E2_ATTR.map(([n,m])=>({n,m,v:Math.round(m*(c2/200)*(0.7+rnd()*.55))}));

  <div class="kv"><div><b class="num">${avg}</b><span>pontuação média (${avgP} no ciclo anterior)</span></div><div><b class="num">${crit.length}</b><span>equipes abaixo de 600 pontos</span></div><div><b class="num">${dist["Excelência"]||0}</b><span>equipes em excelência</span></div><div><b class="num">${byDelta.filter(t=>t.hist[CUR]-t.hist[CUR-1]<=-60).length}</b><span>quedas de 60 pontos ou mais</span></div></div>
  <h3>Leitura do ciclo</h3><p>A pontuação média ${avg>=avgP?"subiu":"caiu"} ${Math.abs(avg-avgP)} pontos em relação a ${CYCLES[CUR-1]}. ${crit.length?`${crit.length} equipe${crit.length>1?"s":""} ${crit.length>1?"estão":"está"} abaixo de 600 pontos, ${crit.filter(t=>t.vuln).length} dela${crit.filter(t=>t.vuln).length===1?"":"s"} em território de alta vulnerabilidade, o que recomenda prioridade nas visitas técnicas.`:"Nenhuma equipe está em zona crítica ou insuficiente."} A perda de pontos concentra-se no Eixo 3 (${Math.round(loss.e3/tot*100)}% dos pontos não alcançados), seguido do Eixo 2 (${Math.round(loss.e2/tot*100)}%) e do Eixo 1 (${Math.round(loss.e1/tot*100)}%).</p>
  <h3>Causas de perda por eixo</h3><ul><li><strong>Eixo 3:</strong> os indicadores com maior perda acumulada são ${topInd.map(x=>`"${x[0]}" (${x[1]} pts)`).join(", ")}.</li><li><strong>Eixo 2:</strong> o atributo Acesso é o mais citado entre detratores; pelo Quadro 7 ele tem peso 2 na conversão do NPS em pontos.</li><li><strong>Eixo 1:</strong> o Bloco C (estrutura) concentra as não conformidades que dependem da gestão distrital e central.</li></ul>
  <h3>Maiores quedas</h3><div class="tbl-wrap"><table><thead><tr><th>Equipe</th><th>${profile==="central"?"Distrito":"Unidade"}</th><th>${CYCLES[CUR-1]}</th><th>${CYCLES[CUR]}</th><th>Variação</th><th>Zona</th></tr></thead><tbody>${byDelta.slice(0,5).map(row).join("")}</tbody></table></div>
  <h3>Maiores ganhos</h3><div class="tbl-wrap"><table><thead><tr><th>Equipe</th><th>${profile==="central"?"Distrito":"Unidade"}</th><th>${CYCLES[CUR-1]}</th><th>${CYCLES[CUR]}</th><th>Variação</th><th>Zona</th></tr></thead><tbody>${byDelta.slice(-3).reverse().map(row).join("")}</tbody></table></div>
  <h3>Ranking do ciclo</h3><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Equipe</th><th>${profile==="central"?"Distrito":"Unidade"}</th><th>Pontos</th><th>Zona</th></tr></thead><tbody>${ranked.slice(0,10).map((t,i)=>`<tr class="click" data-id="${t.id}"><td class="num">${i+1}</td><td>${t.name}</td><td>${profile==="central"?t.district:t.usf}</td><td class="num">${t.hist[CUR]}</td><td><span class="zone ${zone(t.hist[CUR]).cls}">${zone(t.hist[CUR]).name}</span></td></tr>`).join("")}</tbody></table></div>${ranked.length>10?`<p class="gain" style="margin-top:6px">Exibindo 10 de ${ranked.length} equipes. A versão em PDF traz a lista completa.</p>`:""}
  <h3>Três ações recomendadas</h3><ul><li>Priorizar visita técnica às equipes abaixo de 600 pontos em território vulnerável, com plano de apoio registrado antes do fechamento da ASU.</li><li>Mutirão distrital de pré-natal e citopatológico, indicadores com maior perda acumulada no Eixo 3.</li><li>Revisar a organização da agenda para demanda espontânea nas unidades com NPS negativo no atributo Acesso.</li></ul>
  <p class="gain" style="margin-top:18px">Fontes: Manual de Avaliação de Qualidade (v. 02.03.26), Quadros 4, 7 e 10; indicadores do Eixo 3 conforme Anexo 2. Migrações de profissional e INE resolvidas antes da agregação (regra D4).</p></section>`}
function vCentral(){const byD=DISTRICTS.map(d=>{const l=teams.filter(t=>t.district===d);const avg=Math.round(l.reduce((a,t)=>a+t.hist[CUR],0)/l.length),prev=Math.round(l.reduce((a,t)=>a+t.hist[CUR-1],0)/l.length);return{d,l,avg,prev,crit:l.filter(t=>t.hist[CUR]<600).length}}).sort((a,b)=>a.avg-b.avg);
  const all=teams;const al=alerts(()=>true).filter(a=>!alertState[a.id]&&a.sev==="crit").slice(0,5);
  const focus=distFilter?teams.filter(t=>t.district===distFilter).sort((a,b)=>a.hist[CUR]-b.hist[CUR]):null;
  return header("Painel municipal","Rede municipal · 8 distritos sanitários · ciclo "+CYCLES[CUR],`<span class="chip">${fmt(3000)} profissionais</span><span class="chip">${teams.length} equipes na amostra</span>`)+tiles(all)+
  `<div class="grid2"><section class="card"><div class="sec-h"><h2>Distritos por pontuação média</h2><span class="eyebrow">clique para ver as equipes</span></div><div class="dist">${byD.map(x=>`<div class="drow ${distFilter===x.d?"on":""}" data-d="${x.d}"><span><b>${x.d}</b><br><span class="cr">${x.crit} abaixo de 600</span></span><div class="bar" title="${x.d}: ${x.avg} pontos"><i style="width:${x.avg/10}%;background:${x.avg<700?"var(--serious)":"var(--bar)"}"></i></div><span class="num" style="text-align:right"><b>${x.avg}</b><br>${deltaHtml(x.avg-x.prev)}</span></div>`).join("")}</div>
  <div class="ai-note">Padrão detectado: ${byD.slice(0,2).map(x=>x.d).join(" e ")} concentram ${byD[0].crit+byD[1].crit} das ${all.filter(t=>t.hist[CUR]<600).length} equipes abaixo de 600 pontos. O atributo Acesso da ASU caiu em 6 dos 8 distritos.</div></section>
  <section class="card"><div class="sec-h"><h2>${focus?"Equipes de "+distFilter:"Alertas críticos da rede"}</h2>${focus?'<button class="more" data-d="">Fechar</button>':'<button class="more" data-go="alertas">Ver todos</button>'}</div>${focus?`<div class="teams" style="grid-template-columns:1fr 1fr">${focus.map(teamCard).join("")}</div>`:`<div class="alerts">${al.map(alertRow).join("")}</div>`}</section></div>`}
/* ---------- chatbot (roteirizado) ---------- */
const chatLog=[];
const QUICK=["Por que a eSF Alto do Mandu I caiu de zona?","Quais os prazos do ciclo 2026.2?","Como o NPS vira pontos no Eixo 2?","Quais equipes do distrito estão em zona crítica?","O que é avaliado no Bloco C?"];
function answer(q){const P=PROFILES[profile];const l=q.toLowerCase();const scoped=teams.filter(P.scope);
  const named=teams.find(t=>l.includes(t.name.toLowerCase()))||scoped.find(t=>l.includes(t.usf.replace("USF ","").toLowerCase()));
  if(named&&!P.scope(named))return{h:`Não tenho acesso aos dados da ${named.name}: ela está fora do recorte do seu perfil (${P.label}). Perfil local vê a própria equipe; distrital vê o distrito; central vê a rede.`,src:["Documento de Requisitos, regras de negócio (perfis de acesso)"]};
  if(named&&/(por que|porque|caiu|perdeu|queda|motivo)/.test(l)){const b=breakdown(named);const wi=[...b.inds].sort((x,y)=>x.v/x.m-y.v/y.m).slice(0,2),wa=[...b.attrs].sort((x,y)=>x.v/x.m-y.v/y.m)[0];const s=named.hist[CUR],p=named.hist[CUR-1];
    return{h:`A ${named.name} foi de ${p} para ${s} pontos (${s-p>=0?"+":""}${s-p}), passando de ${zone(p).name} para ${zone(s).name}. A perda se concentra em:<ul><li><b>Eixo 3</b>: "${wi[0].n}" (${wi[0].v} de ${wi[0].m}) e "${wi[1].n}" (${wi[1].v} de ${wi[1].m}).</li><li><b>Eixo 2</b>: NPS ${b.nps}, com pior avaliação em ${wa.n} (${wa.v} de ${wa.m}).</li><li><b>Eixo 1</b>: ${b.e1} de 200 pontos.</li></ul>Abra a página da equipe para ver as 4 recomendações priorizadas.`,src:["Resultados do ciclo "+CYCLES[CUR]+" (middleware de leitura)","Manual de Avaliação de Qualidade, Quadros 4 e 7"],team:named}}
  if(/prazo|calend|cronograma|quando|data/.test(l))return{h:`Ciclo ${CYCLES[CUR]} (2º quadrimestre de 2026):<ul><li>Autoavaliação por equipes (Eixo 1): encerrada em 31/08.</li><li>Satisfação do usuário (Eixo 2): coleta contínua por QR code e WhatsApp até 30/09.</li><li>Indicadores de desempenho (Eixo 3): consolidação a partir dos dados do e-SUS até 15/10.</li><li>Certificação e divulgação no painel: prevista para 31/10.</li></ul>Datas ilustrativas para o protótipo; a versão final lê o calendário oficial do programa.`,src:["Manual de Avaliação de Qualidade, seção Ciclos e Fases","Manual de Gestão para Gestores(as) Distritais, v3"]};
  if(/nps|asu|satisfa|detrator|promotor/.test(l))return{h:`O Eixo 2 vale 200 pontos e usa uma adaptação do NPS. Cada uma das 6 perguntas gera um NPS (promotores menos detratores) que é convertido em pontos por faixa: NPS de 75 a 100 dá a pontuação máxima; de 50 a 74, zona de qualidade; de 0 a 49, aperfeiçoamento; NPS negativo, zona crítica. Acesso, Integralidade e Longitudinalidade têm peso 2 (até 40 pontos cada); os demais atributos, peso 1 (até 20 pontos).`,src:["Manual de Avaliação de Qualidade, Eixo 2, Quadros 5 e 7"]};
  if(/bloco c|estrutura/.test(l))return{h:`O Bloco C do Eixo 1 avalia a estrutura da Atenção Básica e vale 80 pontos: Delineamento da população eletiva (5), Mecanismos para oferecer acesso (15), Ferramentas de planejamento (5), Recursos Humanos (25) e Componentes estruturais (30). Como boa parte depende da gestão, o Manual de Gestão orienta os distritos a olhar o Bloco C na estratificação das equipes.`,src:["Manual de Avaliação de Qualidade, Eixo 1, Quadro 4","Manual de Gestão para Gestores(as) Distritais, seção Certificação de Equipes"]};
  if(/zona|classifica|certifica|faixa|excel|crítica|critica/.test(l)&&!/quais/.test(l))return{h:`A certificação usa a pontuação final dos 3 eixos (até 1.000 pontos): Excelência a partir de 900; Qualidade de 800 a 899; Aperfeiçoamento de 600 a 799; Crítica de 400 a 599; Insuficiente de 0 a 399. Equipes que se recusam a participar ou não enviam dados aos sistemas da AB são desclassificadas.`,src:["Manual de Avaliação de Qualidade, Quadro 10 (Certificação da qualidade das equipes)"]};
  if(/quais|liste|lista|mostre/.test(l)){const crit=scoped.filter(t=>t.hist[CUR]<600).sort((a,b)=>a.hist[CUR]-b.hist[CUR]);return{h:crit.length?`${crit.length} equipe${crit.length>1?"s":""} de ${P.label} abaixo de 600 pontos no ciclo ${CYCLES[CUR]}:<ul>${crit.slice(0,8).map(t=>`<li>${t.name} (${t.usf}): ${t.hist[CUR]} pts, ${zone(t.hist[CUR]).name}${t.vuln?", território vulnerável":""}</li>`).join("")}</ul>${crit.length>8?`E mais ${crit.length-8}. `:""}Recomendo começar pelas equipes em território vulnerável.`:`Nenhuma equipe de ${P.label} está abaixo de 600 pontos neste ciclo.`,src:["Resultados do ciclo "+CYCLES[CUR]+" (middleware de leitura)","Manual de Avaliação de Qualidade, Quadro 10"]}}
  if(/migra|ine|vínculo|vinculo/.test(l))return{h:`Quando um profissional ou um INE muda de equipe, a avaliação de NPS conta para a equipe em que ele estava vinculado na data da interação, e o INE inicia nova série a partir da mudança. Essas migrações são resolvidas antes de qualquer relatório, por isso os números aqui podem divergir do painel atual apenas por regra documentada.`,src:["Documento de Requisitos, decisões D4 e RF03, RNF06"]};
  if(/dado|lgpd|privac|externa|seguran/.test(l))return{h:`Este assistente responde apenas com a base interna do programa (manuais, resultados e documentos do NIIMA), respeita o seu perfil de acesso e não envia dados para serviços externos. Em produção a inferência roda em servidor da própria Secretaria; toda consulta fica registrada em trilha de auditoria.`,src:["Documento de Requisitos, RF09, RNF01, RNF05"]};
  return{h:`Posso ajudar com resultados das equipes do seu recorte (${P.label}), critérios e pontuação dos 3 eixos, prazos do ciclo e regras do programa. Experimente uma das perguntas sugeridas ou cite o nome de uma equipe.`,src:["Base interna do Recife Monitora"]}}
function vChat(){const P=PROFILES[profile];return header("Assistente do Recife Monitora",`Responde com a base interna do programa · recorte: ${P.label}`,`<span class="chip">Sem acesso a IAs externas</span>`)+
  `<section class="card chat"><div class="msgs" id="msgs">${chatLog.length?"":`<div class="msg b">Olá, ${P.n.split(" ")[0]}. Posso responder sobre resultados, manuais, prazos e critérios do Recife Monitora, sempre citando a fonte. O que você quer saber?</div>`}${chatLog.map(m=>m.u?`<div class="msg u">${m.u}</div>`:`<div class="msg b">${m.h}<div class="srcs">${m.src.map(s=>`<span class="src">${s}</span>`).join("")}</div>${m.team?`<div style="margin-top:8px"><button class="btn sm" data-open="${m.team.id}">Abrir página da equipe</button></div>`:""}<div class="scope">Perfil ${profile} · dados do ciclo ${CYCLES[CUR]}</div></div>`).join("")}</div>
  <div class="composer"><div class="quick">${QUICK.map(q=>`<button data-q="${q}">${q}</button>`).join("")}</div><form id="chatf"><input id="chati" autocomplete="off" placeholder="Pergunte sobre equipes, prazos, critérios ou manuais" aria-label="Pergunta"><button class="btn pri" type="submit">Enviar</button></form><div class="privacy">🔒 Consultas restritas à base interna, registradas em trilha de auditoria (LGPD).</div></div></section>`}
function ask(q){chatLog.push({u:q});view="chat";render();const m=$("#msgs");const ty=document.createElement("div");ty.className="typing";ty.textContent="Consultando a base interna…";m.appendChild(ty);m.scrollTop=m.scrollHeight;
  setTimeout(()=>{chatLog.push(answer(q));render();const mm=$("#msgs");mm.scrollTop=mm.scrollHeight},700)}
/* ---------- render ---------- */
function render(){const P=PROFILES[profile];$("#who-n").textContent=P.n;$("#who-r").textContent=P.r;$("#who-av").textContent=P.av;renderNav();
  const m=$("#main");m.innerHTML=view==="painel"?vPainel():view==="alertas"?vAlertas():view==="equipe"?vEquipe():view==="resumo"?vResumo():vChat();
  m.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>{selTeam=+el.dataset.id;view="equipe";render();window.scrollTo(0,0)});
  m.querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{e.stopPropagation();selTeam=+el.dataset.open;view="equipe";render();window.scrollTo(0,0)});
  m.querySelectorAll("[data-done]").forEach(el=>el.onclick=e=>{e.stopPropagation();alertState[el.dataset.done]="done";toast("Alerta marcado como tratado.");render()});
  m.querySelectorAll("[data-snooze]").forEach(el=>el.onclick=e=>{e.stopPropagation();alertState[el.dataset.snooze]="snoozed";toast("Alerta adiado por 7 dias.");render()});
  m.querySelectorAll("[data-z]").forEach(el=>el.onclick=()=>{filterZone=el.dataset.z;render()});
  m.querySelectorAll("[data-d]").forEach(el=>el.onclick=()=>{distFilter=el.dataset.d||null;render()});
  m.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{view=el.dataset.go;render()});
  m.querySelectorAll("[data-toast]").forEach(el=>el.onclick=()=>toast(el.dataset.toast));
  m.querySelectorAll("[data-ask]").forEach(el=>el.onclick=()=>ask(el.dataset.ask));
  m.querySelectorAll("[data-q]").forEach(el=>el.onclick=()=>ask(el.dataset.q));
  const back=$("#back");if(back)back.onclick=()=>{view="painel";render()};
  const menu=$("#menu");if(menu)menu.onclick=()=>$("#side").classList.toggle("open");
  const f=$("#chatf");if(f){f.onsubmit=e=>{e.preventDefault();const v=$("#chati").value.trim();if(v){$("#chati").value="";ask(v)}};const mm=$("#msgs");mm.scrollTop=mm.scrollHeight}}
$("#profile").onchange=e=>{profile=e.target.value;view="painel";selTeam=null;filterZone="todas";distFilter=null;chatLog.length=0;render()};
document.addEventListener("click",e=>{if(window.innerWidth<=820&&!e.target.closest("#side")&&!e.target.closest("#menu"))$("#side").classList.remove("open")});
render();
</script>
</body>
</html>
